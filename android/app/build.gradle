import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// One catalog supplies web, Windows and Android versions. Preserve existing IDs.
def auralisProducts = new JsonSlurper().parse(rootProject.file('../products.json'))
def auralisVersionCode = { String version ->
    def parts = version.tokenize('.').collect { it.toInteger() }
    if (parts.size() != 3 || parts[1] > 99 || parts[2] > 99) throw new GradleException('Invalid Auralis version: ' + version)
    parts[0] * 10000 + parts[1] * 100 + parts[2]
}


android {
    buildFeatures { buildConfig true }
    namespace = "com.oscard.prismapdf"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oscard.prismapdf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode auralisVersionCode(auralisProducts.pdf.version)
        versionName auralisProducts.pdf.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions 'product'
    productFlavors {
        pdf {
            dimension 'product'
            applicationId 'com.oscard.prismapdf'
            versionCode auralisVersionCode(auralisProducts.pdf.version)
            versionName auralisProducts.pdf.version
            resValue 'string', 'app_name', 'Auralis Folio'
            resValue 'string', 'title_activity_main', 'Auralis Folio'
        }
        writer {
            dimension 'product'
            applicationId 'com.oscard.prismawriter'
            versionCode auralisVersionCode(auralisProducts.writer.version)
            versionName auralisProducts.writer.version
            resValue 'string', 'app_name', 'Auralis Scribe'
            resValue 'string', 'title_activity_main', 'Auralis Scribe'
        }
        sheets {
            dimension 'product'
            applicationId 'com.oscard.prismasheets'
            versionCode auralisVersionCode(auralisProducts.sheets.version)
            versionName auralisProducts.sheets.version
            resValue 'string', 'app_name', 'Auralis Orbit'
            resValue 'string', 'title_activity_main', 'Auralis Orbit'
        }
        slides {
            dimension 'product'
            applicationId 'com.oscard.prismaslides'
            versionCode auralisVersionCode(auralisProducts.slides.version)
            versionName auralisProducts.slides.version
            resValue 'string', 'app_name', 'Auralis Nova'
            resValue 'string', 'title_activity_main', 'Auralis Nova'
        }
        data {
            dimension 'product'
            applicationId 'com.oscard.prismadata'
            versionCode auralisVersionCode(auralisProducts.data.version)
            versionName auralisProducts.data.version
            resValue 'string', 'app_name', 'Auralis Nexus'
            resValue 'string', 'title_activity_main', 'Auralis Nexus'
        }
        publisher {
            dimension 'product'
            applicationId 'com.oscard.prismapublisher'
            versionCode auralisVersionCode(auralisProducts.publisher.version)
            versionName auralisProducts.publisher.version
            resValue 'string', 'app_name', 'Auralis Canvas'
            resValue 'string', 'title_activity_main', 'Auralis Canvas'
        }
        architecture {
            dimension 'product'
            applicationId 'com.oscard.prismaarquitectura'
            versionCode auralisVersionCode(auralisProducts.architecture.version)
            versionName auralisProducts.architecture.version
            resValue 'string', 'app_name', 'Auralis Atlas'
            resValue 'string', 'title_activity_main', 'Auralis Atlas'
        }
        stories {
            dimension 'product'
            applicationId 'com.oscard.asteorialore'
            versionCode auralisVersionCode(auralisProducts.stories.version)
            versionName auralisProducts.stories.version
            resValue 'string', 'app_name', 'Auralis Lore'
            resValue 'string', 'title_activity_main', 'Auralis Lore'
        }
        prisma {
            dimension 'product'
            applicationId 'com.oscard.prisma'
            versionCode auralisVersionCode(auralisProducts.prisma.version)
            versionName auralisProducts.prisma.version
            resValue 'string', 'app_name', 'Auralis'
            resValue 'string', 'title_activity_main', 'Auralis'
        }
    }
    signingConfigs {
        release {
            if (System.getenv('PRISMA_KEYSTORE_FILE')) {
                storeFile file(System.getenv('PRISMA_KEYSTORE_FILE'))
                storePassword System.getenv('PRISMA_KEY_PASSWORD')
                keyAlias 'prisma-pdf'
                keyPassword System.getenv('PRISMA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PRISMA_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

